name: Node.js Package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
      - run: npm ci
      - run: npm run build:prod -w @criteria-ts/core
      - run: npm publish --tag latest --access public -w @criteria-ts/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
